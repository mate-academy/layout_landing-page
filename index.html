    <link

  <body class="page__body">
    <header>
      <div class="top-bar">
        <a href="#">
          <img

            src="images/THE MET.png"
            alt="logo"
          />

        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--phone"
          ></a>
          <a
            href="#menu"
            class="icon icon--menu"
          ></a>
        </div>
      </div>
      <div class="top-bar__bottom">
        <h1 class="top-bar__title">
          Welcome
          <br />
          to The MET
        </h1>
      </div>
    </header>

    <aside

      id="menu"

      <div class="top-bar">
        <a href="#">
          <img
            src="images/THE MET.png"
            alt="logo"
          />
        </a>
        <a

        ></a>

      <nav class="nav">
        <ul class="nav-list">
          <li class="nav__item">
            <a
              class="nav__link"
              href="#"

          <li class="nav__item">
            <a
              class="nav__link"
              href="#about-us"
            >
              About Us
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#now-on-view"
            >
              Now on view
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#explore-oneline"

            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#contacts"

              Contacts
            </a>
          </li>
        </ul>
      </nav>
      <div class="number">
        <a
          href="tel:+1 212-535-7710"
          class="menu__phone-number"
        >
          The Met Fifth Avenue
          <br />
          +1 212-535-7710
        </a>
        <a
          href="tel:+1 212-923-3700"
          class="menu__phone-number"
        >
          The Met Cloisters
          <br />
          +1 212-923-3700
        </a>
      </div>
      <a
        href="tel:+1 212-923-3700"
        class="menu__call-to-order"

        call to order
      </a>

    <main class="main">
      <section id="about-us">
        <h2>Museum hours</h2>
      </section>

      <section id="now-on-view">
        <h2>Now On View</h2>
      </section>

      <section id="explore-oneline">
        <h2>More to Explore Online</h2>
      </section>

      <section id="contacts">
        <h2>Contact us</h2>
      </section>
