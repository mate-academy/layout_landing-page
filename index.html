<!-- #region head -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      href="src/images/logo.svg"
      type="image/x-icon"
    />
    <title>The Met</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="true"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->

  <body class="page__body">
    <header class="header">
      <div class="top-bar header__top">
        <a
          href="#"
          class="top-bar__logo"
        >
          <img
            src="src/images/logo.svg"
            alt="MET logo"
          />
        </a>

        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--phone"
          ></a>
          <a
            href="#menu"
            class="icon icon--menu"
          ></a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="header__title">
          Welcome
          <br />
          to The MET
        </h1>
      </div>
    </header>

    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="top-bar menu__top">
        <a
          href="#"
          class="top-bar__logo"
        >
          <img
            src="src/images/logo.svg"
            alt="MET logo"
          />
        </a>
        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Home
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#about"
              >
                About Us
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#gallery"
              >
                Now on view
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#explore"
              >
                Explore Online
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#contact"
              >
                Contacts
              </a>
            </li>
          </ul>
        </nav>
        <div class="phones menu__phones">
          <ul class="phones__list">
            <li class="phones__item">
              <p class="phones__title">The Met Fifth Avenue</p>
              <a
                href="tel:+12125357710"
                class="phones__number"
              >
                +1 212-535-7710
              </a>
            </li>
            <li class="phones__item">
              <p class="phones__title">The Met Cloisters</p>
              <a
                href="tel:12129233700"
                class="phones__number"
              >
                +1 212-923-3700
              </a>
            </li>
          </ul>
        </div>
        <a
          href="#"
          class="menu__call-to-order"
        >
          call to order
        </a>
      </div>
    </aside>

    <main class="main">
      <section
        class="about"
        id="about"
      >
        <h2>Museum hours</h2>
      </section>
      <section
        class="gallery"
        id="gallery"
      >
        <h2>Now On View</h2>
      </section>
      <section
        class="explore"
        id="explore"
      >
        <h2>More to Explore Online</h2>
      </section>
      <section
        class="contact"
        id="contact"
      >
        <h2>Contact us</h2>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
