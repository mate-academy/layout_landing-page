<!doctype html>
<html lang="en">
  <!-- #region head -->
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MyBike</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>

  <!-- #endregion -->

  <body>
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a
            href="#"
            class="nav__link"
          >
            <img
              class="nav__logo"
              src="src/images/brand-logo.png"
              alt="brand-logo"
            />
          </a>

          <div class="nav__action">
            <a
              href="#"
              class="nav__action-btn"
            >
              <img
                src="src/images/icon-phone.svg"
                alt="phone-icon"
              />
            </a>
            <a
              href="#"
              class="nav__action-btn"
            >
              <img
                src="src/images/icon-burger-menu.svg"
                alt="menu-icon"
              />
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero-section">
        <h1 class="hero-section__title">Take the Streets</h1>
      </section>

      <section class="statement-section">
        <div class="container">
          <h2 class="section-title section-title--margin-modifier-firstchild">
            Move Free
          </h2>
          <p class="statement-section__text">
            Shift your ride, not gears. Find the fastest way to move in the city
            as the bike adapts intuitively to power the speed you need.
          </p>
        </div>
      </section>

      <section class="recomendation-section">
        <h2 class="section-title"></h2>
      </section>

      <section class="details-section">
        <h2 class="section-title"></h2>
      </section>

      <section class="contact-section">
        <h2 class="section-title"></h2>
      </section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
