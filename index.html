<!-- #region head-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/main.scss">
    <link rel="stylesheet" href="style.css">
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion-->
  <body class="page__body">
    <header class="header">
      <div class="header__top">
        <a href="#" class="header__logo">
          <span></span>
          <!--
          <img src="images/logo.png" alt="Bose logo">
          -->
        </a>
        <div class=" header__icons">
          <a href="#" class="icon icon--phone"></a>
          <a href="#" class="icon icon--menu"></a>
        </div>
      </div>

      <div class="header__bottom">
        <div class="header__waves"></div>
        <h1 class="header__title">

          <br>

        </h1>
      </div>
    </header>






    <aside class="menu">
      <div class="menu__top">
        <a href="#">
          <span class="menu__logo"></span>
        </a>


        <a href="#" class="icon icon--close"></a>
      </div>
    </aside>

    <main class="main">
      <section class="museum-hours" id="museum-hours">
        <h2 class="section-title">Museum hours</h2>
      </section>

      <section class="categories" id="categories">
        <h2 class="section-title now-on-view">Now On View</h2>
        <p class="product__description explore">Explore exhibition gallery guides, videos, articles, and more.</p>

        <div class="recommended__products">
          <article class="product">
            <div class="product__images">
              <img
                src="images/acts/88339a46c3d3b0a6063a0ab01dac388423143465.png"
                alt="Product"
                class="product__image"
              >
              <img
                src="images/acts/70124ecf4fc53c75514dfb3e15b48ff669d760ee.png"
                alt="Product"
                class="product__image"
              >
            </div>
            <h3 class="product__title">A New Look at Old Masters</h3>
            <p class="product__description">
              December 12, 2020 – Through Spring 2023
            </p>
          </article>

          <article class="product">
            <div class="product__images">
              <img
                src="images/acts/2294c93c6b8e87adbf1789f789867b59efeaaaef.png"
                alt="Product"
                class="product__image"
              >
              <img
                src="images/acts/c05f40b427d3d39892ef071b73ce28a385f67550.png"
                alt="Product"
                class="product__image"
              >
              <img
                src="images/acts/1cc9e2c7f6baa564c245912969b065bd4371e17a.png"
                alt="Product"
                class="product__image"
              >
            </div>
            <h3 class="product__title">Bodhisattvas of Wisdom, Compassion, and Power</h3>
            <p class="product__description">
              March 27, 2021 – October 30, 2022
            </p>
          </article>
        </div>
      </section>




      <section class="more" id="more">
        <h2 class="section-title section-title--align-left">More to Explore Online</h2>
      </section>

      <section class="contact-us" id="contacts">
        <h2 class="section-title">Contact Us</h2>
      </section>

    </main>

    <footer class="footer"></footer>
  </body>
</html>
