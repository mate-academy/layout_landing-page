<!--#region head-->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="icon" type="image/x-icon"
    href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:wght@100..900&display=swap"
    rel="stylesheet">
    <form onsubmit="this.reset(); return false;"></form>
    <title>B&O</title>
    <link
      rel="stylesheet"
      href="../src/styles/main.scss"
    />
    <script
      src="../src/scripts/main.js"
      defer
    ></script>
  </head>
  <!--#endregion-->
  <body class="page__body">

    <header class="header">

      <div class="top-bar">
        <a href="#" class="top-bar__logo">
          <img src="../images/logo.png" alt="B&O logo">
        </a>
        <div class="top-bar__icons">
          <a href="tel:+1 234 5555-55-55" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">
        Your senses.
          <br>
        Set free.
        </h1>
      </div>

    </header>

    <aside class="menu page__menu" id="menu">
      <div class="top-bar menu__top">
        <a href="#" class="top-bar__logo">
          <img src="../images/logo.png" alt="B&O logo">
        </a>
        <a href="#" class="icon icon--close"></a>
      </div>

      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#recommended"
              class="nav__link">Recommended</a>
            </li>
            <li class="nav__item">
              <a href="#categories"
              class="nav__link">Categories</a>
            </li>
            <li class="nav__item">
              <a href="#about-us"
             class="nav__link">About Us</a>
            </li>
            <li class="nav__item">
              <a href="#contact-us"
              class="nav__link">Contact Us</a>
            </li>
          </ul>
        </nav>

        <a href="tel:+1 234 5555-55-55"
        class="menu__phone-number">
          +1 234 5555-55-55
        </a>
        <a href="tel:+1 234 5555-55-55"
        class="menu__call-to-order">
          Call to order
        </a>
      </div>

    </aside>

    <main>

      <section class="recommended" id="recommended">
        <h2>Recommended</h2>
      </section>

      <section class="categories" id="categories">
        <h2>Sound. Vision.</h2>
      </section>

      <section class="about-us" id="about-us">
        <h2>Timeless, for 50 years and counting</h2>
      </section>

      <section class="contact-us" id="contact-us">
        <h2>Contact us</h2>
      </section>

    </main>

    <footer class="footer"></footer>

  </body>
</html>
