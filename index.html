<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Landing Page</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    >

    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    >

    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>

  <body class="page__body">

    <header class="header">
      <div class="top-bar">
        <a href="#" class="top-bar__logo">
          <img
            src="src/styles/images/Logo.png"
            alt="Nothing logo"
          >
        </a>

        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--phone"
          ></a>

          <a
            href="#menu"
            class="icon icon--menu"
          ></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="title">
          Bring joy back
          <br>
          to the everyday
        </h1>
      </div>
    </header>

    <aside
      class="page__menu menu"
      id="menu"
    >
      <div class="top-bar menu__top">
        <a href="#" class="top-bar__logo">
          <img
            src="src/styles/images/Logo.png"
            alt="Nothing logo"
          >
        </a>

        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                class="nav__link"
                href="#Products"
              >
                Products
              </a>
            </li>

            <li class="nav__item">
              <a
                class="nav__link"
                href="#Store"
              >
                Store
              </a>
            </li>

            <li class="nav__item">
              <a
                class="nav__link"
                href="#Login"
              >
                Login
              </a>
            </li>

            <li class="nav__item">
              <a
                class="nav__link"
                href="#Cart"
              >
                Cart(0)
              </a>
            </li>
          </ul>
        </nav>

        <a
          href="tel:+12345555555"
          class="menu__phone-number"
        >
          +1 234 5555-55-55
        </a>

        <a
          href="tel:+12345555555"
          class="menu__call-to-order"
        >
          CALL TO ORDER
        </a>
      </div>
    </aside>

    <main class="main">
      <section
        class="products"
        id="Products"
      >
        <h2>Products</h2>
      </section>

      <section
        class="store"
        id="Store"
      >
        <h2>Store</h2>
      </section>

      <section
        class="login"
        id="Login"
      >
        <h2>Login</h2>
      </section>

      <section
        class="cart"
        id="Cart"
      >
        <h2>Cart(0)</h2>
      </section>
    </main>

    <footer class="footer"></footer>

  </body>
</html>
