<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MyBIKE</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__top">
        <a
          class="header__logo"
          href="#"
        >
          <img
            src="src/images/logo.svg"
            alt="MyBIKE logo"
          />
        </a>

        <div class="header__icons">
          <a
            class="header__phone"
            href="tel:+12345555555"
          >
            <span class="header__phone-number">+1 234 555-55-55</span>
            <img
              src="src/images/icon-phone.svg"
              alt="Phone"
            />
          </a>

          <a
            class="header__menu"
            href="#menu"
          >
            <img
              src="src/images/icon-menu.svg"
              alt="Open menu"
            />
          </a>
        </div>
      </div>

      <h1 class="header__title">Take the Streets</h1>
    </header>
    <aside
      class="page__menu menu"
      id="menu"
    >
      <div class="menu__top">
        <a
          class="menu__logo"
          href="#"
        >
          <img
            src="src/images/logo-dark.svg"
            alt="MyBIKE logo"
          />
        </a>

        <a
          class="menu__close"
          href="#"
        >
          <img
            src="src/images/icon-close.svg"
            alt="Close menu"
          />
        </a>
      </div>
    </aside>
  </body>
</html>
