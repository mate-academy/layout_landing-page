<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>B&O Landing</title>

    <link rel="icon" href="./images/favicon.jpg" />

    <link rel="stylesheet" href="./styles/main.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__container container">
        <a href="#" class="header__logo">
          <img src="./images/logo-bo.png" alt="Bang & Olufsen Logo" />
        </a>

        <input
          type="checkbox"
          id="menu-toggle"
          class="header__toggle"
        />

        <label
          for="menu-toggle"
          class="header__menu-button"
          aria-label="Open menu"
        >
          <img src="./images/icon-menu.svg" alt="Menu" />
        </label>

        <nav class="menu">
          <label
            for="menu-toggle"
            class="menu__close"
            aria-label="Close menu"
            role="button"
          >
            <img src="./images/icon-close.svg" alt="Close" />
          </label>

          <ul class="menu__list">
            <li><a href="#">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">How to buy</a></li>
            <li><a href="#">Contacts</a></li>
          </ul>

          <div class="menu__contacts">
            <a href="tel:+19876543210">
              +1 987 654 3210
            </a>

            <a href="mailto:support@bo.com">
              support@bo.com
            </a>
          </div>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="hero__image">
        <img
          src="./images/hero-bo.jpg"
          alt="Bang & Olufsen Headphones"
        />
      </div>

      <div class="hero__text container">
        <p class="hero__title">
          Sound perfected.<br />
          Designed for life.
        </p>
      </div>
    </section>

    <section class="products" id="products">
      <div class="container">
        <h2 class="products__title">Products</h2>

        <ul class="products__list">
          <li class="products__item">
            <img
              src="./images/product-speaker-1.png"
              alt="Beosound A1"
              class="products__image"
            />

            <p class="products__name">
              Beosound A1
            </p>

            <p class="products__price">
              $ 349.00
            </p>
          </li>

          <li class="products__item">
            <img
              src="./images/product-speaker-2.png"
              alt="Beosound Balance"
              class="products__image"
            />

            <p class="products__name">
              Beosound Balance
            </p>

            <p class="products__price">
              $ 219.00
            </p>
          </li>
        </ul>
      </div>
    </section>

    <footer class="footer">
      <div class="container footer__container">
        <p>
          © 2025 Bang & Olufsen. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
