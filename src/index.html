<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bike</title>
    <link
      rel="stylesheet"
      href="/css/main.min.css"
    />
  </head>
  <!-- #endregion -->
  <body>
    <header class="header">
      <div class="header__top top-bar">
        <a href="#">
          <img
            class="top-bar__logo"
            src="./images/Logo.png"
            alt="Bike logo"
          />
        </a>
        <div class="header__icons">
          <a
            href="#"
            class="header__icon header__icon--phone"
          ></a>
          <a
            href="#menu"
            class="header__icon header__icon--menu"
          ></a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="header__title">Take the Streets</h1>
      </div>
    </header>

    <aside
      class="menu"
      id="menu"
    >
      <div class="menu__top top-bar">
        <a href="#">
          <img
            class="top-bar__logo"
            src="./images/logo-mobile.png"
            alt="Bike logo"
          />
        </a>
        <a
          href="#"
          class="menu__icon-close"
        ></a>
      </div>
      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="menu__list">
            <li class="menu__item">
              <a
                class="menu__link"
                href="#"
              >
                Home
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#about"
              >
                About Us
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#compare"
              >
                Compare Bikes
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#details"
              >
                Details
              </a>
            </li>
            <li class="menu__item">
              <a
                class="menu__link"
                href="#contacts"
              >
                Contacts
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <a
        href="tel:+1 234 5555-55-55"
        class="menu__phone"
      >
        +1 234 5555-55-55
      </a>
      <a
        href="tel:+1 234 5555-55-55"
        class="menu__book"
      >
        Book a test ride
      </a>
    </aside>

    <main>
      <section
        class="about"
        id="about"
      >
        <h2>Move Free</h2>
      </section>

      <section
        class="compare"
        id="compare"
      >
        <h2>Compare bikes</h2>
      </section>

      <section
        class="details"
        id="details"
      >
        <h2>The details</h2>
      </section>

      <section
        class="contacts"
        id="contacts"
      >
        <h2>Contact us</h2>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
