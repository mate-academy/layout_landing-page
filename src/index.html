<!-- #region Head -->
<!doctype html>
<html
  class="page"
  lang="en"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Nothing</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <script
      src="scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <!-- #region Header -->
    <header class="header">
      <div class="header__content">
        <div class="top-bar">
          <a
            href="https://nothingphone.com.ua/"
            target="_blank"
          >
            <img
              class="top-bar__logo"
              src="../images/logo.png"
              alt="Nothing logo"
            />
          </a>
          <div class="top-bar__icons">
            <a
              href="tel:+1 234 5555-55-55"
              class="icon icon--phone"
            ></a>
            <a
              href="#menu"
              class="icon icon--menu"
            ></a>
          </div>
        </div>

        <h1 class="header__title">
          Bring joy back
          <br />
          to the everyday
        </h1>
      </div>
    </header>
    <!-- #endregion -->
    <!-- #region Menu -->
    <aside
      class="menu page__menu"
      id="menu"
    >
      <div class="top-bar menu__top">
        <a
          href="https://nothingphone.com.ua/"
          target="_blank"
        >
          <img
            src="../images/logo.png"
            alt="Nothing logo"
            class="top-bar__logo"
          />
        </a>

        <div class="top-bar__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <div class="menu__content">
        <nav class="nav menu__nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                class="nav__link"
                href="#category"
              >
                Products
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#recommended"
              >
                Store
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#contact"
              >
                Login
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#about"
              >
                Cart(0)
              </a>
            </li>
          </ul>
        </nav>
        <a
          href="tel:+1 234 5555-55-55"
          class="menu__tel"
        >
          +1 234 5555-55-55
        </a>
        <a
          href="tel:+1 234 5555-55-55"
          class="menu__call"
        >
          call to order
        </a>
      </div>
    </aside>
    <!-- #endregion -->

    <main>
      <section>
        <h2>Recommended</h2>
      </section>
      <section>
        <h2>Browse Nothing products by category</h2>
      </section>
      <section>
        <h2>About us</h2>
      </section>
      <section>
        <h2>Contact us</h2>
      </section>
    </main>
  </body>
</html>
